# Minimal single-binary Loki for the demo stack: everything (ingester, querier,
# store) in one process, chunks on the local filesystem, ring in memory. Enough
# to aggregate the six services' logs; not a production topology.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # the ECS lines carry many JSON fields; keep Loki from rejecting them as labels
  # (labels come from Alloy relabeling, the JSON stays in the log body)
  max_label_names_per_series: 15
  reject_old_samples: true
  reject_old_samples_max_age: 168h
