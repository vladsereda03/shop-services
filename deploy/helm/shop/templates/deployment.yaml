{{- range $name, $svc := .Values.services }}
{{- $defaults := $.Values.defaults }}
{{- $probes := $defaults.probes }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "shop.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  {{- if not (and $svc.autoscaling $svc.autoscaling.enabled) }}
  # HPA-managed services omit replicas so the autoscaler owns the count (see hpa.yaml)
  replicas: {{ $svc.replicas | default $defaults.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" (dict "name" $name) | nindent 6 }}
  template:
    metadata:
      annotations:
        # Prometheus scrapes pods carrying these annotations (see observability/prometheus.yaml)
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: {{ $svc.port | quote }}
      labels:
        {{- include "shop.selectorLabels" (dict "name" $name) | nindent 8 }}
    spec:
      # the image already runs as the non-root `spring` user (see Dockerfile);
      # enforce it at the pod level too
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}/{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: shop-config
            - secretRef:
                name: shop-secrets
          {{- with $svc.env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ $probes.startup.path }}
              port: http
            failureThreshold: {{ $probes.startup.failureThreshold }}
            periodSeconds: {{ $probes.startup.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ $probes.liveness.path }}
              port: http
            periodSeconds: {{ $probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ $probes.readiness.path }}
              port: http
            periodSeconds: {{ $probes.readiness.periodSeconds }}
          resources:
            {{- toYaml ($svc.resources | default $defaults.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # writable scratch for the JVM / embedded Tomcat under a read-only root filesystem
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
