apiVersion: v1
kind: Secret
metadata:
  name: shop-secrets
  labels:
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
# stringData: plaintext here, base64-encoded by Kubernetes on apply
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}