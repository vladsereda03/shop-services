server:
  port: 8082

spring:
  application:
    # short lowercase name: it becomes the service name in Zipkin traces
    name: product
  threads:
    virtual:
      # one virtual thread per request: blocking work (JDBC, neighbour HTTP) parks
      # the virtual thread and frees its carrier instead of holding a pooled OS thread
      enabled: true
  mvc:
    problemdetails:
      # RFC 7807 application/problem+json bodies for MVC-handled errors
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/products
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    # dev DBs already contain the schema: mark them with a baseline instead of running V1
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth.local:9000
          jwk-set-uri: http://auth.local:9000/oauth2/jwks

  data:
    redis:
      # catalog cache backend (host mode: a standalone Redis on localhost; the compose stack
      # overrides the host to the `redis` container). Lettuce connects lazily.
      host: localhost
      port: 6379
  cache:
    # Redis-backed cache manager (see CacheConfig); explicit so the provider is unambiguous
    type: redis

management:
  endpoints:
    web:
      exposure:
        # only what we consume: health for container probes, prometheus for scraping
        include: health, prometheus
  endpoint:
    health:
      probes:
        # adds /actuator/health/liveness and /actuator/health/readiness
        enabled: true
  tracing:
    sampling:
      # export every trace — demo setting; production typically samples 1-10%
      probability: 1.0

# object storage (MinIO / any S3): product image bytes live in a bucket, not in the catalog
# payload. `endpoint` is where product PUTs/GETs (host-published MinIO in host mode; the compose
# stack overrides it to the internal minio:9000). `public-base-url` is what the browser fetches —
# always the host-published address, since the browser runs on the host even in compose.
app:
  storage:
    endpoint: http://localhost:9002
    access-key: minioadmin
    secret-key: minioadmin
    bucket: product-images
    public-base-url: http://localhost:9002/product-images
  cache:
    # how long a cached catalog entry lives before it must be re-read from PostgreSQL
    catalog-ttl: 10m

---
# dev profile: verbose SQL logging for local runs (SPRING_PROFILES_ACTIVE=dev)
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true