# Slimmed sibling of the root docker-compose.yaml, brought up by the e2e tests (see E2eStack).
# It wires the real built service images (shop/<svc>:latest) together over real backing infra —
# the cross-service paths the per-service integration tests stub out at the HTTP level.
#
# Deliberately trimmed vs the root stack, on purpose and documented in the README:
#   * no observability plane (Prometheus / Grafana / Loki / Alloy / Zipkin) — not under test;
#   * a single-node Kafka (KRaft combined mode) instead of the 3+3 split cluster.
# The JWT signing keys are injected as ephemeral values by the test (withEnv), so running this
# needs no secret. Service images are a precondition (CI builds them; locally `docker compose build`).
#
# No top-level `name:` — Testcontainers assigns a unique compose project name per run.

x-db-env: &db-env
  SPRING_DATASOURCE_USERNAME: shop
  SPRING_DATASOURCE_PASSWORD: shop

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    volumes:
      # mirrors infra/docker/postgres/init-databases.sql — the five service databases
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 15

  kafka:
    # single-node KRaft (broker + controller in one process); mirrors the Helm dev-infra config
    image: apache/kafka:4.0.0
    environment:
      CLUSTER_ID: Efq_Ydb1S-Km8YPiqv8SfQ
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  auth:
    image: shop/auth:latest
    environment:
      <<: *db-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authDB
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # single-broker Kafka here: create the topic with replication factor 1 (the app defaults to the
      # 3-broker compose cluster), matching how the integration tests override it
      APP_KAFKA_TOPIC_USER_REGISTERED_REPLICAS: "1"
      APP_KAFKA_TOPIC_USER_REGISTERED_MIN_INSYNC_REPLICAS: "1"
      # ephemeral RSA signing key pair, injected by the test — see E2eStack
      JWK_KEY_ID: ${JWK_KEY_ID:?injected by the e2e test}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?injected by the e2e test}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?injected by the e2e test}
    networks:
      default:
        # the OIDC issuer http://auth.local:9000 resolves to this container in-network, exactly as
        # in the root compose — so the resource servers validate tokens with no code change
        aliases: [auth.local]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  product:
    image: shop/product:latest
    environment:
      <<: *db-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/products
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_ACCESS_KEY: minioadmin
      APP_STORAGE_SECRET_KEY: minioadmin
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8082 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  cart:
    image: shop/cart:latest
    environment:
      <<: *db-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/carts
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # single-broker Kafka: create the dead-letter topic with replication factor 1 (app defaults to 3)
      APP_KAFKA_TOPIC_DLT_REPLICAS: "1"
      # the checkout scenario provisions carts on demand (getOrCreateCart), so the user-registered
      # consumer is not needed here; disabling it avoids a single-node group-coordinator retry storm
      # that otherwise starves cart's HTTP threads and makes the order->cart hop flaky. The Kafka
      # provisioning path itself is covered by cart's own integration test.
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      # application.yaml defaults services.product.base-url to http://product.local:8082; use the
      # plain in-network service name here (auth.local stays as-is — that alias is on the auth container)
      SERVICES_PRODUCT_BASE_URL: http://product:8082
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8083 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  order:
    image: shop/order:latest
    environment:
      <<: *db-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      # application.yaml defaults services.cart.base-url to http://cart.local:8083
      SERVICES_CART_BASE_URL: http://cart:8083
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8084 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
